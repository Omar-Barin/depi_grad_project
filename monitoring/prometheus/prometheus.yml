global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'inventory-server'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['server:8000']
        labels:
          service: 'inventory-server'
          env: 'dev'

  - job_name: 'inventory-alert-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['alert-service:8001']
        labels:
          service: 'alert-service'
          env: 'dev'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          env: 'dev'
